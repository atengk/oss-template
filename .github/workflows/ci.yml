# ==============================================================================
# 工作流：持续集成与质量守门流水线 (CI)
# 适用场景：开源脚手架工程自身的通用 PR 门禁、Shell 自动化脚本质量扫描与语法检查
# 触发条件：
#   - push: 主干分支 (main, master) 代码推送
#   - pull_request: 针对主干分支的 PR 创建、编辑、代码同步
# 核心特性：
#   - 动态并发控制 (Dynamic Concurrency)：PR 提交自动中断陈旧任务，主干提交按序排队
#   - 内部路径短路直通 (Path Fast-Pass)：纯文档改动秒级放行，彻底消除分支保护规则死锁
#   - 全局超时防护 (Timeout Protection)：每个任务显式声明 timeout-minutes 兜底
#   - 终审门禁看板 (All Checks Passed)：统一盖戳并直出 GitHub Step Summary 结构化报告
# ==============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, edited, synchronize, reopened]

# 动态并发控制：PR 提交自动取消陈旧构建以节约算力；主干提交排队顺序执行保历史完整
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 最小权限原则：全局仅授予代码读取权限
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: PR 标题规范校验 (仅在 PR 触发时执行)
  # ----------------------------------------------------------------------------
  validate-pr-title:
    name: 校验 PR 标题规范
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: 校验 PR 标题符合 Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  # ----------------------------------------------------------------------------
  # Job 2: 动态探测变更路径 (实现内部短路直通网关)
  # ----------------------------------------------------------------------------
  detect-changes:
    name: 探测变更路径
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 分析改动文件类型
        id: filter
        run: |
          # 计算改动文件列表
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || true)
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            else
              CHANGED_FILES="all"
            fi
          fi

          if [ -z "$CHANGED_FILES" ]; then
            # 兜底防御：无法探测具体文件时默认执行全量测试
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 过滤忽略文档、Markdown、Git 配置与许可证文件
          CORE_CHANGES=$(echo "$CHANGED_FILES" | grep -vE '^(\.gitignore|\.editorconfig|LICENSE|.*\.md|docs/.*)$' || true)
          if [ -n "$CORE_CHANGES" ]; then
            echo "检测到核心脚本/配置/代码变更:"
            echo "$CORE_CHANGES"
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "仅检测到文档或说明文件变更，触发短路直通模式。"
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------------------
  # Job 3: 模版工程自动化脚本与 Git 钩子语法分析与静态检查 (受控于路径探测)
  # ----------------------------------------------------------------------------
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code_changed != 'false'
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 静态校验工程脚本与 Git 钩子语法与规范 (Bash Syntax & ShellCheck)
        run: |
          if ls scripts/*.sh >/dev/null 2>&1; then
            bash -n scripts/*.sh
            shellcheck --severity=warning scripts/*.sh
          fi
          if [ -d .githooks ]; then
            # 过滤仅对包含 Shell Shebang 的实际钩子脚本执行静态校验（自动跳过文档与占位文件）
            HOOK_FILES=$(grep -l '^#!' .githooks/* 2>/dev/null || true)
            if [ -n "$HOOK_FILES" ]; then
              echo "$HOOK_FILES" | xargs -r bash -n
              echo "$HOOK_FILES" | xargs -r shellcheck --severity=warning
            fi
          fi

      - name: 基础门禁校验通过通知
        run: |
          echo "✅ CI 通用门禁（PR 标题规范与 Shell 脚本静态自检）已全部通过！"
          echo "💡 如需启用具体语言生态（Java / Node / Go / Python / Rust）的构建与测试流水线，"
          echo "   请直接参考并复制 .github/workflow-templates/languages/ 对应模版至本工作流。"

  # ----------------------------------------------------------------------------
  # Job 4: 全局工作流与模版静态语法与架构规范校验 (actionlint 模版守护)
  # ----------------------------------------------------------------------------
  lint-workflows:
    name: 工作流规范扫描 (actionlint)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code_changed != 'false'
    timeout-minutes: 5
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 actionlint 并扫描全部工作流与模版
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          find .github/workflows .github/workflow-templates -type f \( -name "*.yml" -o -name "*.yaml" \) -print0 | xargs -0 ./actionlint -color
        shell: bash

  # ----------------------------------------------------------------------------
  # Job 5: 质量门禁终审盖戳 (分支保护规则唯一指定强绑门禁)
  # ----------------------------------------------------------------------------
  all-checks-passed:
    name: 质量门禁终审 (All Checks Passed)
    runs-on: ubuntu-latest
    needs: [detect-changes, validate-pr-title, build-and-test, lint-workflows]
    if: always()
    timeout-minutes: 5

    steps:
      - name: 汇总校验各任务执行结果
        run: |
          TITLE_RESULT="${{ needs.validate-pr-title.result }}"
          DETECT_RESULT="${{ needs.detect-changes.result }}"
          TEST_RESULT="${{ needs.build-and-test.result }}"
          LINT_WF_RESULT="${{ needs.lint-workflows.result }}"

          echo "任务状态汇总: PR标题=[$TITLE_RESULT], 变更探测=[$DETECT_RESULT], 脚本测试=[$TEST_RESULT], 模版扫描=[$LINT_WF_RESULT]"

          # 校验是否有任何必要任务失败或被取消
          if [ "$TITLE_RESULT" = "failure" ] || [ "$TITLE_RESULT" = "cancelled" ]; then
            echo "::error::PR 标题规范校验失败！请按照 Conventional Commits 规范修改 PR 标题。"
            exit 1
          fi

          if [ "$DETECT_RESULT" = "failure" ] || [ "$DETECT_RESULT" = "cancelled" ]; then
            echo "::error::变更路径探测任务异常中断！"
            exit 1
          fi

          if [ "$TEST_RESULT" = "failure" ] || [ "$TEST_RESULT" = "cancelled" ]; then
            echo "::error::工程脚本构建与语法自检失败！"
            exit 1
          fi

          if [ "$LINT_WF_RESULT" = "failure" ] || [ "$LINT_WF_RESULT" = "cancelled" ]; then
            echo "::error::工作流模版 actionlint 规范静态扫描失败！"
            exit 1
          fi

          echo "✅ 全部必要质量门禁已全部通过！"

      - name: 生成门禁看板摘要报告
        if: always()
        run: |
          {
            echo "## 🚦 CI 质量门禁终审报告"
            echo ""
            echo "| 检查项 | 判定状态 | 执行说明 |"
            echo "| :--- | :---: | :--- |"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "| **PR 标题规范校验** | ${{ needs.validate-pr-title.result == 'success' && '✅ 通过' || '❌ 失败' }} | Conventional Commits 语义化规范 |"
            fi
            echo "| **变更路径探测** | ${{ needs.detect-changes.result == 'success' && '✅ 通过' || '❌ 异常' }} | 区分文档短路与核心代码构建 |"
            if [ "${{ needs.detect-changes.outputs.code_changed }}" = "false" ]; then
              echo "| **脚本与模版测试** | ⚡ 短路直通 | 仅涉及文档改动，自动跳过耗时测试并放行 |"
            else
              echo "| **Shell 脚本自检** | ${{ needs.build-and-test.result == 'success' && '✅ 通过' || '❌ 失败' }} | ShellCheck 静态扫描与语法自检 |"
              echo "| **模版库规范扫描** | ${{ needs.lint-workflows.result == 'success' && '✅ 通过' || '❌ 失败' }} | actionlint 工作流语法与依赖校验 |"
            fi
            echo ""
            echo "> 💡 **分支保护规则建议**：请在 GitHub 仓库设置中将 \`质量门禁终审 (All Checks Passed)\` 设为唯一 Required Status Check。"
          } >> "$GITHUB_STEP_SUMMARY"
