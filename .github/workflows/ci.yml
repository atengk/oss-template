# ==============================================================================
# 工作流：持续集成与质量守门流水线 (CI)
# 适用场景：开源脚手架工程自身的通用 PR 门禁、Shell 自动化脚本质量扫描与语法检查
# 触发条件：
#   - push: 主干分支 (main, master) 代码推送
#   - pull_request: 针对主干分支的 PR 创建、编辑、代码同步
# 核心特性：
#   - Conventional Commits PR 标题规范静态校验 (语义化 PR 标题门禁)
#   - 工程内置自动化脚本 (scripts/*.sh) 语法检查 (bash -n) 与静态代码分析 (ShellCheck)
#   - Git 原生客户端钩子 (.githooks/*) 语法规范与合法性扫描
# 业务扩展指引：
#   - 本工程为通用开源模版脚手架，若已确定具体业务语言生态 (Java / Node / Go / Python / Rust)，
#     请直接从 .github/workflow-templates/languages/<language>/ci.yml 拷贝专属构建与单测流水线。
# ==============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, edited, synchronize, reopened]

# 并发控制：同一分支/PR 有新提交时自动取消正在执行的陈旧构建，防止竞态并节省 Runner 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：仅授予代码仓库读取权限
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: PR 标题规范校验 (仅在 PR 触发时执行)
  # ----------------------------------------------------------------------------
  validate-pr-title:
    name: 校验 PR 标题规范
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: 校验 PR 标题符合 Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  # ----------------------------------------------------------------------------
  # Job 2: 模版工程自动化脚本与 Git 钩子语法分析与静态检查
  # ----------------------------------------------------------------------------
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 静态校验工程脚本与 Git 钩子语法与规范 (Bash Syntax & ShellCheck)
        run: |
          if ls scripts/*.sh >/dev/null 2>&1; then
            bash -n scripts/*.sh
            shellcheck --severity=warning scripts/*.sh
          fi
          if [ -d .githooks ]; then
            # 过滤仅对包含 Shell Shebang 的实际钩子脚本执行静态校验（自动跳过文档与占位文件）
            HOOK_FILES=$(grep -l '^#!' .githooks/* 2>/dev/null || true)
            if [ -n "$HOOK_FILES" ]; then
              echo "$HOOK_FILES" | xargs -r bash -n
              echo "$HOOK_FILES" | xargs -r shellcheck --severity=warning
            fi
          fi

      # ------------------------------------------------------------------------
      # 业务构建与测试流水线指引 (Ecosystem CI Templates)
      # 完整支持 Java / Node / Go / Python / Rust 的 CI、Publish 与 Docker 模版，
      # 请参考并复制使用: .github/workflow-templates/languages/<language>/ci.yml
      # ------------------------------------------------------------------------
      - name: 基础门禁校验通过通知
        run: |
          echo "✅ CI 通用门禁（PR 标题规范与 Shell 脚本静态自检）已全部通过！"
          echo "💡 如需启用具体语言生态（Java / Node / Go / Python / Rust）的构建与测试流水线，"
          echo "   请直接参考并复制 .github/workflow-templates/languages/ 对应模版至本工作流。"
