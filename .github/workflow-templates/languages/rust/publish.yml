# ==============================================================================
# 工作流模版：Rust 发行包发布至 Crates.io (Rust Publish - Crates.io)
# 适用场景：开源 Rust 类库、CLI 工具发布至 Crates 官方源 (crates.io)，并支持跨平台编译二进制挂载
# 触发通道：
#   - 标签推送 (push tags: v*)：与 GitHub Release 发版工作流协同触发
#   - 网页手动触发 (workflow_dispatch)：支持指定目标版本号手动触发发布
# 核心依赖凭据 (Secrets)：
#   - CARGO_REGISTRY_TOKEN: 在 crates.io 账户中创建的 API 密钥 (用于 cargo publish)
# 核心特性：
#   - 官方源自动发布 (cargo publish)
#   - 可选矩阵多架构交叉编译 (Linux x86_64, macOS x86_64, macOS aarch64, Windows x86_64)
#   - 依托 taiki-e/upload-rust-binary-action 将跨平台编译完成的可执行二进制自动挂载至 GitHub Release 附件
# ==============================================================================

name: Rust Publish (Crates.io)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (形如 v1.0.0)'
        required: true
        type: string

# 并发控制：包分发流水线单例排队执行，严禁取消
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: 发布类库至 Crates.io 官方索引库
  # ----------------------------------------------------------------------------
  publish-crates:
    name: 发布 Crates 至 Crates.io 官方源
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - name: 解析版本号
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.version }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag_name }}

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: 发布至 Crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

