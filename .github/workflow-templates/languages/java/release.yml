# ==============================================================================
# 工作流模版：Java 统合发版编排流水线 (Java Unified Release)
# 适用场景：Spring Boot 应用、开源类库与 Starter 组件的一站式全自动发版
# 架构规范：Build Once, Distribute Everywhere (单次测试与构建，多路并行安全分发)
# 触发通道：
#   - 标签推送 (push tags: v*)：本地执行 git tag v1.0.0 && git push origin v1.0.0
#   - 网页手动触发 (workflow_dispatch)：在 Actions 界面输入版本号 (如 v1.0.0)，自动校验后发版
# 核心特性：
#   - 统合发版前置测试门禁 (gate-test)：Maven 单元测试未过绝对不流转
#   - 单次编译构建 Jar 产物：统一打包目标二进制，生成 SHA-256 Checksums 并跨任务复用
#   - GitHub Release 发版：基于 git-cliff 自动提取更新日志并挂载产物附件
#   - Maven Central 中心仓库分发：支持 GPG 签名与 Sonatype Central Portal 构件发布
#   - Docker 多架构容器镜像：构建 Spring Boot 多架构镜像推至 GHCR，严格防污染 latest 标签
#   - 开发者体验看板：执行完毕直出富文本 $GITHUB_STEP_SUMMARY 结构化制品与拉取指令清单
# ==============================================================================

name: Java Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (必须以 v 开头，符合 SemVer 规范，如 v1.0.0 或 v1.0.0-rc.1)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: 生产级发版前置质量门禁 (Gate Test)
  # ----------------------------------------------------------------------------
  gate-test:
    name: 发版前置质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 执行回归单元测试
        run: |
          mvn clean test -B
          echo "✅ 发版前置质量门禁全部通过！"

  # ----------------------------------------------------------------------------
  # Job 2: 打包构建目标 Jar 并计算不可变校验和 (Build Once)
  # ----------------------------------------------------------------------------
  build-artifacts:
    name: 编译打包发行制品与生成哈希
    runs-on: ubuntu-latest
    needs: [gate-test]
    timeout-minutes: 15
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      raw_version: ${{ steps.meta.outputs.raw_version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析与校验发版版本号
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.version }}"
            if [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then TAG_NAME="v$TAG_NAME"; fi
            if ! echo "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              echo "::error::版本号 [$TAG_NAME] 不符合语义化版本规范！"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi

          RAW_VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "raw_version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG_NAME" =~ - ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 更新 pom.xml 版本并执行构建打包
        run: |
          mvn versions:set -DnewVersion=${{ steps.meta.outputs.raw_version }} -DgenerateBackupPoms=false
          mvn clean package -DskipTests -B
          mkdir -p dist
          cp target/*.jar dist/ 2>/dev/null || true
          cd dist
          if ls * >/dev/null 2>&1; then
            sha256sum $(ls -1 | grep -v '^checksums\.txt$') > checksums.txt
            echo "=== 构建产物校验和清单 ==="
            cat checksums.txt
          fi

      - name: 归档不可变制品附件
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          retention-days: 1

  # ----------------------------------------------------------------------------
  # Job 3: 发布 GitHub Release 与挂载产物
  # ----------------------------------------------------------------------------
  publish-release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出源码 (全量历史供日志生成)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载构建制品
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: 生成发布日志 (git-cliff)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: ${{ hashFiles('.cliff.toml') != '' && '.cliff.toml' || '' }}
          args: --tag ${{ needs.build-artifacts.outputs.tag_name }} --latest --strip header --github-repo ${{ github.repository }}
        env:
          OUTPUT: CHANGELOG_RELEASE.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 GitHub Release 并挂载附件
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-artifacts.outputs.tag_name }}
          name: ${{ needs.build-artifacts.outputs.tag_name }}
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: ${{ needs.build-artifacts.outputs.is_prerelease == 'true' }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # Job 4 (可选扩展): 发布构件至 Maven Central (如未配置密钥会自动跳过)
  # ----------------------------------------------------------------------------
  publish-maven:
    name: 发布至 Maven Central
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    timeout-minutes: 20
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    steps:
      - name: 检出源码
        if: env.CENTRAL_USERNAME != ''
        uses: actions/checkout@v4

      - name: 设置 Java 环境与 GPG
        if: env.CENTRAL_USERNAME != ''
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: 发布构件至 Maven Central
        if: env.CENTRAL_USERNAME != ''
        run: |
          mvn versions:set -DnewVersion=${{ needs.build-artifacts.outputs.raw_version }} -DgenerateBackupPoms=false
          mvn clean deploy -DskipTests -B

  # ----------------------------------------------------------------------------
  # Job 5: 构建 Spring Boot 多架构 Docker 容器镜像并推送至 GHCR
  # ----------------------------------------------------------------------------
  publish-docker:
    name: 构建并推送 Docker 镜像 (GHCR)
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: 转换仓库名称为全小写
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 QEMU 模拟器 (多架构支持)
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 镜像元数据与标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ env.REPO_LC }}
          flavor: |
            latest=${{ needs.build-artifacts.outputs.is_prerelease != 'true' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.build-artifacts.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build-artifacts.outputs.tag_name }}
            type=sha,format=short

      - name: 构建并推送多架构镜像 (amd64 / arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 6: 结构化发版看板摘要报告直出
  # ----------------------------------------------------------------------------
  summary:
    name: 输出发版看板报告
    runs-on: ubuntu-latest
    needs: [build-artifacts, publish-release, publish-docker]
    if: always()
    timeout-minutes: 5
    steps:
      - name: 生成富文本发版报告
        run: |
          TAG="${{ needs.build-artifacts.outputs.tag_name }}"
          REPO_LC="${GITHUB_REPOSITORY,,}"
          {
            echo "## 🚀 Java 统合发版全景看板"
            echo ""
            echo "| 发版维度 | 状态 | 详细信息 |"
            echo "| :--- | :---: | :--- |"
            echo "| **发版版本** | \`$TAG\` | ${{ needs.build-artifacts.outputs.is_prerelease == 'true' && '🧪 Pre-release' || '🎉 稳定正式版' }} |"
            echo "| **GitHub Release** | ${{ needs.publish-release.result == 'success' && '✅ 成功' || '❌ 失败' }} | Jar 包与校验和附件已挂载 |"
            echo "| **GHCR 容器镜像** | ${{ needs.publish-docker.result == 'success' && '✅ 成功' || '❌ 失败' }} | 多架构 \`linux/amd64,arm64\` 镜像已推送 |"
            echo ""
            echo "### 📦 容器镜像拉取验证"
            echo '```bash'
            echo "docker pull ghcr.io/${REPO_LC}:${TAG#v}"
            if [ "${{ needs.build-artifacts.outputs.is_prerelease }}" != "true" ]; then
              echo "docker pull ghcr.io/${REPO_LC}:latest"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
