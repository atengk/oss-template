# ==============================================================================
# 部署模版：云主机 / VPS 自动化部署 (SSH & Docker Compose)
# 适用场景：单机 Linux 云服务器 (阿里云/腾讯云/AWS EC2/各类 VPS) 上的 Docker Compose 服务滚动发布
# 触发通道：
#   - 网页控制台手动触发 (workflow_dispatch)：支持指定特定 service_name 或自定义 deploy_dir
#   - 💡 安全防呆设计：单机生产部署默认严格禁用 push 自动穿透，杜绝未经测试的代码误上线；
#     如需在特定场景下实现自动化 CD，可配置 on.workflow_run 监听 Release 或 CI 成功事件。
# 核心依赖凭据 (Secrets)：
#   - SSH_HOST: 目标服务器公网 IP 或域名 (必填)
#   - SSH_USERNAME: 登录用户名 (如 root 或 deployer，必填)
#   - SSH_PRIVATE_KEY: SSH 私钥文本内容 (Ed25519 或 RSA，必填)
#   - SSH_PORT: SSH 端口号 (可选，默认为 22)
# 核心特性：
#   - 使用 appleboy/ssh-action@v1 执行免密远程安全通道发布
#   - 脚本内变量内联插值，彻底免疫远端 Linux OpenSSH AcceptEnv 环境变量白名单限制
#   - 支持 docker compose pull && up -d --remove-orphans 平滑热更新与 prune 清理
#   - 内置线上服务健康探测、超时保护与 Step Summary 看板输出
# ==============================================================================

name: Deploy - SSH & Docker Compose

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: '需重启的目标服务名称 (留空则更新全量服务)'
        required: false
        default: ''
      deploy_dir:
        description: '远端部署目录绝对路径'
        required: false
        default: '/opt/apps/my-project'

# 并发控制：生产部署单例排队执行，严禁取消
concurrency:
  group: deploy-ssh-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy-remote:
    name: 远端主机拉取镜像并滚动更新
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://your-domain.com # 替换为实际服务对外访问域名
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 执行 SSH 远端部署指令 (Docker Compose)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            DEPLOY_DIR="${{ inputs.deploy_dir || '/opt/apps/my-project' }}"
            TARGET_SERVICE="${{ inputs.service_name || '' }}"

            echo "正在切换至目标部署目录: $DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            if [ ! -f docker-compose.yml ] && [ ! -f compose.yaml ] && [ ! -f docker-compose.yaml ]; then
              echo "错误: 在 [$DEPLOY_DIR] 目录下未找到 docker-compose 配置文件！"
              exit 1
            fi

            echo "开始拉取最新容器镜像..."
            if [ -n "$TARGET_SERVICE" ]; then
              echo "针对指定服务 [$TARGET_SERVICE] 执行更新:"
              docker compose pull "$TARGET_SERVICE"
              docker compose up -d --remove-orphans "$TARGET_SERVICE"
            else
              echo "针对当前项目全量服务执行平滑滚动更新:"
              docker compose pull
              docker compose up -d --remove-orphans
            fi

            echo "清理废弃的无标签悬空镜像 (dangling images)..."
            docker image prune -f

            echo "✅ 远端 Docker Compose 服务更新已全部就绪！"

      - name: 生产环境健康检查与冒烟测试 (Smoke Test)
        run: |
          HEALTH_URL="${{ vars.APP_HEALTH_CHECK_URL || 'https://your-domain.com/health' }}"
          if [[ "$HEALTH_URL" == *"your-domain.com"* ]]; then
            echo "::warning::检测到当前健康检查地址仍为示例占位符 [$HEALTH_URL]，已跳过冒烟探测。建议在仓库中配置 Vars: APP_HEALTH_CHECK_URL 以启用自动就绪验证！"
          else
            echo "正在对线上服务执行健康冒烟探测: $HEALTH_URL ..."
            curl --fail --retry 5 --retry-delay 5 --max-time 10 "$HEALTH_URL"
            echo "✅ 线上服务健康检查通过！"
          fi

      - name: 输出部署看板摘要
        if: always()
        run: |
          {
            echo "## 🖥️ 云主机 SSH & Docker Compose 部署看板"
            echo ""
            echo "| 属性 | 配置值 |"
            echo "| :--- | :--- |"
            echo "| **目标服务器** | \`${{ secrets.SSH_HOST || '***' }}\` |"
            echo "| **部署目录** | \`${{ inputs.deploy_dir || '/opt/apps/my-project' }}\` |"
            echo "| **目标服务** | \`${{ inputs.service_name || '全量服务更新' }}\` |"
            echo "| **触发者** | \`${{ github.actor }}\` |"
            echo ""
            echo "✅ 远端主机 Docker Compose 滚动更新与健康探测完成！"
          } >> "$GITHUB_STEP_SUMMARY"
