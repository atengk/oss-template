# ==============================================================================
# 部署模版：Vercel 全球边缘节点自动化发布 (Vercel CLI)
# 适用场景：Next.js、Nuxt、SvelteKit、Remix 或前端单页应用 (SPA) 发布至 Vercel
# 触发通道：
#   - push: 主干分支 (main, master) 提交代码自动触发生产部署
#   - workflow_dispatch: 网页控制台手动触发
# 核心依赖凭据 (Secrets)：
#   - VERCEL_TOKEN: Vercel 个人/团队账户生成的访问令牌 (必填)
#   - VERCEL_ORG_ID: Vercel 组织/团队 ID (必填，可在项目 .vercel/project.json 中获取)
#   - VERCEL_PROJECT_ID: Vercel 项目唯一 ID (必填，可在项目设置页中获取)
# 核心特性：
#   - 智能路径过滤：忽略纯非代码类文档改动
#   - 使用官方 Vercel CLI 本地预编译 (vercel build --prod) 与零冷启动上传 (--prebuilt)
#   - 部署完成后自动将线上访问 URL 回传至 GitHub Environment 与 Step Summary 看板
# ==============================================================================

name: Deploy - Vercel

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

# 并发控制：生产部署单例排队执行，严禁取消
concurrency:
  group: deploy-vercel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-vercel:
    name: 自动化构建与发布至 Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装 Vercel CLI
        run: pnpm add -g vercel@latest

      - name: 拉取 Vercel 项目配置与环境变量
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 预编译生产制品 (vercel build --prod)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 部署预构建产物至 Vercel 全球边缘网络
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Vercel 生产部署完成: $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 生产环境健康检查与冒烟测试 (Smoke Test)
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.url }}"
          if [ -n "$DEPLOY_URL" ]; then
            echo "正在对 Vercel 线上部署地址执行健康冒烟探测: $DEPLOY_URL ..."
            curl --fail --retry 5 --retry-delay 5 --max-time 10 "$DEPLOY_URL"
            echo "✅ 线上服务健康检查通过！"
          fi

      - name: 输出部署看板摘要
        if: always()
        run: |
          {
            echo "## ▲ Vercel 生产部署看板"
            echo ""
            echo "| 属性 | 配置值 |"
            echo "| :--- | :--- |"
            echo "| **线上访问地址** | [${{ steps.deploy.outputs.url }}](${{ steps.deploy.outputs.url }}) |"
            echo "| **触发方式** | \`${{ github.event_name }}\` |"
            echo "| **目标提交** | \`${{ github.sha }}\` |"
            echo ""
            echo "✅ Vercel 生产环境边缘部署完成！"
          } >> "$GITHUB_STEP_SUMMARY"
