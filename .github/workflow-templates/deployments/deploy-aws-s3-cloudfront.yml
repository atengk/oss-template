# ==============================================================================
# 部署模版：AWS S3 与 CloudFront 全球 CDN 静态站点发布
# 适用场景：生产级前端应用 (React/Vue/Next/Astro) 或静态文档站点发布至 AWS 基础设施
# 触发通道：
#   - 网页控制台手动触发 (workflow_dispatch)
#   - 💡 安全防呆设计：生产级 AWS 部署默认严格禁用 push 自动穿透，杜绝未经测试的代码误上线；
#     如需在特定场景下实现自动化 CD，可配置 on.workflow_run 监听 Release 或 CI 成功事件。
# 核心依赖凭据 (Secrets)：
#   - AWS_ACCESS_KEY_ID: IAM 访问密钥 ID (传统方式)
#   - AWS_SECRET_ACCESS_KEY: IAM 私有访问密钥 (传统方式)
#   - AWS_ROLE_ARN: AWS IAM 角色 ARN (现代推荐 OIDC 扮演模式，免静态 Secret)
#   - S3_BUCKET_NAME: 目标 AWS S3 存储桶名称 (必填)
#   - CLOUDFRONT_DISTRIBUTION_ID: CloudFront 分发 ID (可选，配置后自动提交全量缓存失效)
#   - AWS_REGION: 目标区域 (可选，默认为 us-east-1)
# 核心特性：
#   - 增量同步静态产物 (aws s3 sync dist/ s3://... --delete)
#   - 自动化提交全网边缘 CDN 缓存刷新失效 (aws cloudfront create-invalidation)
#   - 内置线上服务健康探测、超时保护与 Step Summary 看板输出
# ==============================================================================

name: Deploy - AWS S3 & CloudFront

on:
  workflow_dispatch:

# 并发控制：生产部署单例排队执行，严禁取消
concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # 现代 AWS OIDC 角色扮演 (AssumeRole) 所需权限

jobs:
  deploy-aws:
    name: 同步产物至 S3 并刷新 CloudFront 缓存
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://your-domain.com # 替换为实际 CloudFront 分发域名或自定义域名
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装依赖与构建生产产物
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm run build

      - name: 配置 AWS 凭据 (优先 OIDC 扮演角色，回退使用静态 Key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || '' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || '' }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || '' }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: 同步产物至 S3 存储桶并自动清理陈旧文件
        run: |
          S3_BUCKET="${{ secrets.S3_BUCKET_NAME }}"
          if [ -z "$S3_BUCKET" ]; then
            echo "错误: 未配置 secrets.S3_BUCKET_NAME！"
            exit 1
          fi
          echo "正在增量同步本地产物 [dist/] 至 S3 存储桶 [s3://$S3_BUCKET]..."
          aws s3 sync dist/ "s3://$S3_BUCKET" --delete --cache-control "public, max-age=31536000, immutable"

          # 对 html 文件单独重设短缓存，确保发布即时生效
          aws s3 cp dist/ "s3://$S3_BUCKET" --recursive --exclude "*" --include "*.html" \
            --metadata-directive REPLACE --cache-control "public, max-age=0, must-revalidate"

      - name: 提交 CloudFront 边缘全网节点缓存刷新失效
        if: env.CLOUDFRONT_ID != ''
        env:
          CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          echo "正在向 CloudFront 分发 [$CLOUDFRONT_ID] 提交全量缓存失效请求..."
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_ID" --paths "/*"
          echo "✅ CloudFront 缓存刷新请求已成功提交！"

      - name: 生产环境健康检查与冒烟测试 (Smoke Test)
        run: |
          HEALTH_URL="${{ vars.APP_HEALTH_CHECK_URL || 'https://your-domain.com' }}"
          if [[ "$HEALTH_URL" == *"your-domain.com"* ]]; then
            echo "::warning::检测到当前健康检查地址仍为示例占位符 [$HEALTH_URL]，已跳过冒烟探测。建议在仓库中配置 Vars: APP_HEALTH_CHECK_URL 以启用自动就绪验证！"
          else
            echo "正在对线上服务执行健康冒烟探测: $HEALTH_URL ..."
            curl --fail --retry 5 --retry-delay 5 --max-time 10 "$HEALTH_URL"
            echo "✅ 线上服务健康检查通过！"
          fi

      - name: 输出部署看板摘要
        if: always()
        run: |
          {
            echo "## ☁️ AWS S3 & CloudFront 部署看板"
            echo ""
            echo "| 属性 | 配置值 |"
            echo "| :--- | :--- |"
            echo "| **目标存储桶** | \`${{ secrets.S3_BUCKET_NAME || '***' }}\` |"
            echo "| **AWS 区域** | \`${{ secrets.AWS_REGION || 'us-east-1' }}\` |"
            echo "| **触发者** | \`${{ github.actor }}\` |"
            echo ""
            echo "✅ AWS 产物同步与边缘 CDN 缓存刷新完成！"
          } >> "$GITHUB_STEP_SUMMARY"
