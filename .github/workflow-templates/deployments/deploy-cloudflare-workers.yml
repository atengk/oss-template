# ==============================================================================
# 部署模版：Cloudflare Workers 边缘函数自动化发布 (Wrangler)
# 适用场景：基于 Cloudflare Workers 架构的 Serverless API、全栈边缘服务 (如 Hono 等)
# 触发通道：
#   - 网页控制台手动触发 (workflow_dispatch)
#   - 💡 安全防呆设计：生产边缘函数默认严格禁用 push 自动穿透，杜绝未经测试的代码误上线；
#     如需在特定场景下实现自动化 CD，可配置 on.workflow_run 监听 Release 或 CI 成功事件。
# 核心依赖凭据 (Secrets)：
#   - CLOUDFLARE_API_TOKEN: 具有 Workers Scripts 部署权限的 Cloudflare API 令牌 (必填)
#   - CLOUDFLARE_ACCOUNT_ID: Cloudflare 账户 ID (必填)
# 核心特性：
#   - 使用官方 cloudflare/wrangler-action@v3 执行极速全球边缘网络发布
#   - 支持 package.json build 自动化编译探测
#   - 内置线上服务健康探测、超时保护与 Step Summary 看板输出
# ==============================================================================

name: Deploy - Cloudflare Workers

on:
  workflow_dispatch:

# 并发控制：生产部署单例排队执行，严禁取消
concurrency:
  group: deploy-cf-workers-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-workers:
    name: 发布至 Cloudflare Workers 边缘函数
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://your-worker.workers.dev # 替换为实际 Workers 分配的访问地址或自定义域名
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile || pnpm install

      - name: 编译 Worker 产物 (可选)
        run: |
          if jq -e '.scripts.build' package.json >/dev/null 2>&1; then
            pnpm run build
          fi

      - name: 发布至 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 生产环境健康检查与冒烟测试 (Smoke Test)
        run: |
          HEALTH_URL="${{ vars.APP_HEALTH_CHECK_URL || 'https://your-worker.workers.dev' }}"
          if [[ "$HEALTH_URL" == *"your-worker.workers.dev"* ]]; then
            echo "::warning::检测到当前健康检查地址仍为示例占位符 [$HEALTH_URL]，已跳过冒烟探测。建议在仓库中配置 Vars: APP_HEALTH_CHECK_URL 以启用自动就绪验证！"
          else
            echo "正在对线上服务执行健康冒烟探测: $HEALTH_URL ..."
            curl --fail --retry 5 --retry-delay 5 --max-time 10 "$HEALTH_URL"
            echo "✅ 线上服务健康检查通过！"
          fi

      - name: 输出部署看板摘要
        if: always()
        run: |
          {
            echo "## ⚡ Cloudflare Workers 部署看板"
            echo ""
            echo "| 属性 | 配置值 |"
            echo "| :--- | :--- |"
            echo "| **环境** | production |"
            echo "| **触发者** | \`${{ github.actor }}\` |"
            echo ""
            echo "✅ Cloudflare Workers 边缘函数部署与健康探测完成！"
          } >> "$GITHUB_STEP_SUMMARY"
