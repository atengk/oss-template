# ==============================================================================
# 部署模版：Vercel 全球边缘节点自动化发布 (Vercel CLI)
# 适用场景：Next.js、Nuxt、SvelteKit、Remix 或前端单页应用 (SPA) 发布至 Vercel
# 触发通道：
#   - push: 主干分支 (main, master) 提交代码自动触发生产部署
#   - workflow_dispatch: 网页控制台手动触发
# 核心依赖凭据 (Secrets)：
#   - VERCEL_TOKEN: Vercel 个人/团队账户生成的访问令牌 (必填)
#   - VERCEL_ORG_ID: Vercel 组织/团队 ID (必填，可在项目 .vercel/project.json 中获取)
#   - VERCEL_PROJECT_ID: Vercel 项目唯一 ID (必填，可在项目设置页中获取)
# 核心特性：
#   - 使用官方 Vercel CLI 本地预编译 (vercel build --prod) 与零冷启动上传 (--prebuilt)
#   - 部署完成后自动将线上访问 URL 回传至 GitHub Environment 与 Action Summary
#   - 内置线上服务健康探测与冒烟测试 (Smoke Test)
# ==============================================================================

name: Deploy - Vercel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 并发控制：生产部署单例排队执行，严禁取消
concurrency:
  group: deploy-vercel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-vercel:
    name: 自动化构建与发布至 Vercel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装 Vercel CLI
        run: pnpm add -g vercel@latest

      - name: 拉取 Vercel 项目配置与环境变量
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 本地执行 Vercel 生产构建打包
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 部署预编译产物至 Vercel 全球边缘节点
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "✅ 生产部署成功，访问地址: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 生产环境健康检查与冒烟测试 (Smoke Test)
        run: |
          DEPLOYED_URL="${{ steps.deploy.outputs.url }}"
          HEALTH_URL="${{ vars.APP_HEALTH_CHECK_URL || '' }}"
          TARGET_URL="${HEALTH_URL:-$DEPLOYED_URL}"

          if [ -z "$TARGET_URL" ] || [[ "$TARGET_URL" == *"your-domain.com"* ]]; then
            echo "::warning::未检测到有效探测地址，跳过冒烟测试。"
          else
            echo "正在对 Vercel 部署地址执行健康冒烟探测: $TARGET_URL ..."
            curl --fail --retry 5 --retry-delay 5 --max-time 10 "$TARGET_URL"
            echo "✅ 线上服务健康就绪，冒烟探测通过！"
          fi
