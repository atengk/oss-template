# ==============================================================================
# 部署模版：Cloudflare Workers 边缘函数自动化发布 (Wrangler)
# 适用场景：基于 Cloudflare Workers 架构的 Serverless API、全栈边缘服务 (如 Hono 等)
# 触发通道：
#   - push: 主干分支 (main, master) 提交代码自动触发
#   - workflow_dispatch: 网页控制台手动触发
# 核心依赖凭据 (Secrets)：
#   - CLOUDFLARE_API_TOKEN: 具有 Workers Scripts 部署权限的 Cloudflare API 令牌 (必填)
#   - CLOUDFLARE_ACCOUNT_ID: Cloudflare 账户 ID (必填)
# 核心特性：
#   - 使用官方 cloudflare/wrangler-action@v3 执行极速全球边缘网络发布
#   - 支持 package.json build 自动化编译探测
#   - 依托根目录 wrangler.toml 或 wrangler.json 规范化配置文件
#   - 内置线上服务健康探测与冒烟测试 (Smoke Test)
# ==============================================================================

name: Deploy - Cloudflare Workers

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 并发控制：生产部署单例排队执行，严禁取消
concurrency:
  group: deploy-cf-workers-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-workers:
    name: 发布至 Cloudflare Workers 边缘函数
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://your-worker.workers.dev # 替换为实际 Workers 分配的访问地址或自定义域名
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile || pnpm install

      - name: 编译 Worker 产物 (可选)
        run: |
          if jq -e '.scripts.build' package.json >/dev/null 2>&1; then
            pnpm run build
          fi

      # ------------------------------------------------------------------------
      # Cloudflare Workers 部署
      # 依赖：根目录 wrangler.toml / wrangler.json 配置文件
      # 凭据：在仓库配置 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID
      # ------------------------------------------------------------------------
      - name: 部署至 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: 生产环境健康检查与冒烟测试 (Smoke Test)
        run: |
          HEALTH_URL="${{ vars.APP_HEALTH_CHECK_URL || 'https://your-worker.workers.dev' }}"
          if [[ "$HEALTH_URL" == *"workers.dev"* ]] && [[ "$HEALTH_URL" == *"your-worker"* ]]; then
            echo "::warning::检测到当前健康检查地址仍为示例占位符 [$HEALTH_URL]，已跳过冒烟探测。建议在仓库中配置 Vars: APP_HEALTH_CHECK_URL 以启用自动就绪验证！"
          else
            echo "正在对 Cloudflare Workers 执行健康冒烟探测: $HEALTH_URL ..."
            curl --fail --retry 5 --retry-delay 5 --max-time 10 "$HEALTH_URL"
            echo "✅ Workers 服务就绪，冒烟探测通过！"
          fi
