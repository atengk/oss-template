# ==============================================================================
# 部署模版：AWS S3 与 CloudFront 全球 CDN 静态站点发布
# 适用场景：生产级前端应用 (React/Vue/Next/Astro) 或静态文档站点发布至 AWS 基础设施
# 触发通道：
#   - push: 主干分支 (main, master) 提交代码自动触发
#   - workflow_dispatch: 网页控制台手动触发
# 核心依赖凭据 (Secrets)：
#   - AWS_ACCESS_KEY_ID: IAM 访问密钥 ID (传统方式)
#   - AWS_SECRET_ACCESS_KEY: IAM 私有访问密钥 (传统方式)
#   - AWS_ROLE_ARN: AWS IAM 角色 ARN (现代推荐 OIDC 扮演模式，免静态 Secret)
#   - S3_BUCKET_NAME: 目标 AWS S3 存储桶名称 (必填)
#   - CLOUDFRONT_DISTRIBUTION_ID: CloudFront 分发 ID (可选，配置后自动提交全量缓存失效)
#   - AWS_REGION: 目标区域 (可选，默认为 us-east-1)
# 核心特性：
#   - 增量同步静态产物 (aws s3 sync dist/ s3://... --delete)
#   - 自动化提交全网边缘 CDN 缓存刷新失效 (aws cloudfront create-invalidation)
#   - 内置线上服务健康探测与冒烟测试 (Smoke Test)
# ==============================================================================

name: Deploy - AWS S3 & CloudFront

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 并发控制：生产部署单例排队执行，严禁取消
concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # 现代 AWS OIDC 角色扮演 (AssumeRole) 所需权限

jobs:
  deploy-aws:
    name: 同步产物至 S3 并刷新 CloudFront 缓存
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://your-domain.com # 替换为实际 CloudFront 分发域名或自定义域名
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # 静态站点构建步骤（默认为 Node.js / pnpm）
      # 若使用 Python MkDocs、Go Hugo 或 Rust mdBook，仅需替换以下构建逻辑
      # 并确保最终产物输出至指定目录（如 dist、public 或 build）
      # ------------------------------------------------------------------------
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装依赖与构建生产产物
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm run build # 确保构建产物输出至 dist 目录

      # ------------------------------------------------------------------------
      # AWS 鉴权配置
      # 方式 A (传统)：使用静态 IAM Secret (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
      # 方式 B (现代推荐)：使用 GitHub OIDC 免密钥扮演 (role-to-assume: arn:aws:iam::...)
      # ------------------------------------------------------------------------
      - name: 配置 AWS 凭据
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          # 如使用 OIDC 免密钥，解除下方注释并配置角色 ARN：
          # role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          # role-session-name: github-actions-deploy

      - name: 同步产物至 AWS S3 存储桶
        run: |
          echo "正在同步 dist 目录产物至 S3 存储桶: s3://${{ secrets.S3_BUCKET_NAME }} ..."
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: 刷新 AWS CloudFront CDN 全节点缓存
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        env:
          CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          echo "正在向 CloudFront 分发 ID [$CLOUDFRONT_ID] 提交全量缓存失效申请..."
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_ID" --paths "/*"
          echo "✅ CloudFront 缓存刷新指令已成功提交！"

      - name: 生产环境健康检查与冒烟测试 (Smoke Test)
        run: |
          HEALTH_URL="${{ vars.APP_HEALTH_CHECK_URL || 'https://your-domain.com' }}"
          if [[ "$HEALTH_URL" == *"your-domain.com"* ]]; then
            echo "::warning::检测到当前健康检查地址仍为示例占位符 [$HEALTH_URL]，已跳过冒烟探测。建议在仓库中配置 Vars: APP_HEALTH_CHECK_URL 以启用自动就绪验证！"
          else
            echo "正在对 AWS 部署地址执行健康冒烟探测: $HEALTH_URL ..."
            curl --fail --retry 5 --retry-delay 5 --max-time 10 "$HEALTH_URL"
            echo "✅ 线上站点就绪，冒烟探测通过！"
          fi
