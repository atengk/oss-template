# ==============================================================================
# 部署模版：Cloudflare Pages 静态站点与边缘应用自动化发布 (Wrangler)
# 适用场景：现代静态前端应用 (Vite/React/Vue/Astro/Svelte/Next 静态导出) 部署至 Cloudflare 全球边缘 CDN
# 触发通道：
#   - push: 主干分支 (main, master) 提交代码自动触发
#   - workflow_dispatch: 网页控制台手动触发
# 核心依赖凭据 (Secrets & Vars)：
#   - CLOUDFLARE_API_TOKEN: 具有 Cloudflare Pages 编辑权限的 API 令牌 (必填 Secret)
#   - CLOUDFLARE_ACCOUNT_ID: Cloudflare 账户 ID (必填 Secret)
#   - CLOUDFLARE_PROJECT_NAME: Cloudflare Pages 项目名称 (可选 Var，默认 my-pages-project)
# 核心特性：
#   - 智能路径过滤：忽略非代码类纯文档改动
#   - 使用官方 cloudflare/wrangler-action@v3 执行秒级极速全球边缘同步
#   - 部署完成后自动回传全局访问 URL 并绑定至 GitHub Environment 与 Step Summary 看板
# ==============================================================================

name: Deploy - Cloudflare Pages

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

# 并发控制：生产部署单例排队执行，严禁取消
concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-cloudflare:
    name: 构建并部署至 Cloudflare Pages 全球网络
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.publish.outputs.deployment-url }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装依赖与构建生产产物
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm run build # 确保产物输出至 dist 或 build 目录

      - name: 发布产物至 Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'my-pages-project' }}

      - name: 生产环境健康检查与冒烟测试 (Smoke Test)
        run: |
          DEPLOY_URL="${{ steps.publish.outputs.deployment-url }}"
          if [ -n "$DEPLOY_URL" ]; then
            echo "正在对 Cloudflare 边缘部署地址执行健康冒烟探测: $DEPLOY_URL ..."
            curl --fail --retry 5 --retry-delay 5 --max-time 10 "$DEPLOY_URL"
            echo "✅ 线上服务健康检查通过！"
          fi

      - name: 输出部署看板摘要
        if: always()
        run: |
          {
            echo "## ⚡ Cloudflare Pages 部署看板"
            echo ""
            echo "| 属性 | 配置值 |"
            echo "| :--- | :--- |"
            echo "| **线上访问地址** | [${{ steps.publish.outputs.deployment-url }}](${{ steps.publish.outputs.deployment-url }}) |"
            echo "| **项目名称** | \`${{ vars.CLOUDFLARE_PROJECT_NAME || 'my-pages-project' }}\` |"
            echo "| **触发方式** | \`${{ github.event_name }}\` |"
            echo ""
            echo "✅ Cloudflare Pages 全球边缘 CDN 发布完成！"
          } >> "$GITHUB_STEP_SUMMARY"
